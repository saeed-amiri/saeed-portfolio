<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal About page for Saeed Amiri portfolio." />
    <title>Saeed Amiri | About Me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css?v=20261119-1" />
  </head>
  <body class="page-about">
    <header class="site-header">
      <div class="topbar">
        <a class="brand" id="brandName" href="../index.html">Saeed Amiri</a>
        <nav class="controls" aria-label="Primary navigation">
          <a href="projects.html">Projects</a>
          <a href="../index.html">CV</a>
          <a class="active" href="about.html" id="aboutTab">About Me</a>
          <span class="nav-divider" aria-hidden="true"></span>
          <button id="langEn" type="button" aria-label="Switch to English">EN</button>
          <button id="langDe" type="button" aria-label="Switch to German">DE</button>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero page-hero reveal" aria-labelledby="aboutName">
        <div class="hero-portrait">
          <img
            id="aboutProfilePhoto"
            src="../assets/profile-placeholder.svg?v=20260404-1"
            alt="Profile photo"
            class="profile-photo"
          />
        </div>
        <div class="hero-copy">
          <p class="eyebrow" id="aboutHeroEyebrow">Beyond the CV</p>
          <h1 id="aboutName">Saeed Amiri</h1>
          <p id="aboutHeadline" class="hero-headline"></p>
          <p class="hero-statement" id="aboutHeroStatement">
            Curious about how rigorous ideas become useful, dependable systems.
          </p>
          <p id="aboutLocation" class="meta"></p>
          <div class="hero-links">
            <a id="aboutContactEmail" class="contact-link" href="#">email@example.com</a>
            <a id="aboutLinkedin" class="contact-link" href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a id="aboutGithub" class="contact-link" href="#" target="_blank" rel="noopener noreferrer">GitHub</a>
          </div>
          <a id="aboutOpenToWorkLink" class="action-primary" href="mailto:sdamiri7@gmail.com?subject=Collaboration%20Opportunity">Open to Collaboration</a>
        </div>
      </section>

      <div class="editorial-layout">
        <section class="content reveal" id="aboutContentRoot">
          <section class="editorial-section intro-section">
            <p class="section-kicker" id="aboutIntroKicker">Personal perspective</p>
            <h2 id="aboutTitle">About Me</h2>
            <p id="aboutIntro"></p>
          </section>

          <section class="editorial-section" id="aboutSections"></section>

          <section class="editorial-section" id="aboutResourcesPanel" hidden>
            <p class="section-kicker" id="aboutResourcesKicker">Further reading</p>
            <h2 id="aboutResourcesTitle"></h2>
            <p id="aboutResourcesIntro"></p>
            <div id="aboutResourcesContent"></div>
          </section>
        </section>

        <aside class="section-rail" aria-label="About section navigation">
          <ul id="aboutRailList"></ul>
        </aside>
      </div>
    </main>

    <footer class="footer">
      <small id="aboutFooter"></small>
    </footer>

    <div class="modal-backdrop hidden" id="detailModalBackdrop" aria-hidden="true">
      <div class="detail-modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
        <button class="modal-close" id="detailModalClose" type="button" aria-label="Close detail view">×</button>
        <h3 id="detailModalTitle"></h3>
        <div id="detailModalContent"></div>
      </div>
    </div>

    <div class="image-lightbox-backdrop hidden" id="imageLightboxBackdrop" aria-hidden="true">
      <div class="image-lightbox" id="imageLightbox" role="dialog" aria-modal="true" aria-label="Expanded image view">
        <p class="image-lightbox-caption hidden" id="imageLightboxCaption"></p>
        <button class="image-lightbox-close" id="imageLightboxClose" type="button" aria-label="Close image view">×</button>
        <img id="imageLightboxImg" src="" alt="Expanded detail image" />
      </div>
    </div>

    <script type="module" src="../scripts/about.js"></script>
  </body>
</html>
